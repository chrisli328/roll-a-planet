<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Roll A Planet</title>
<!-- The page for the GitHub Pages build (Build.WebStatic, tools/publish-web): the game fills the browser window, as the
     HTML prototype did; on a wide window the game itself draws the phone-sized view on a blurred backdrop. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1440; }
  #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; background: #1d1440; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          padding: 24px; color: #fff; text-align: center; font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #boot h1 { margin: 0; font-size: 26px; }
  #bar { width: min(260px, 70vw); height: 12px; border-radius: 999px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  #fill { width: 0; height: 100%; background: #ffd23f; transition: width .2s; }
  #ver { font-weight: 400; font-size: 13px; opacity: .75; }
  #msg { font-weight: 400; font-size: 14px; color: #ffc4c4; max-width: 420px; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="boot">
  <h1>Roll A Planet</h1>
  <div id="bar"><div id="fill"></div></div>
  <div id="ver"></div>
  <div id="msg"></div>
</div>
<script>
  // version.json sits next to this page on the published site (tools/publish-web writes it): the commit the build is from
  fetch("version.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
    if (v && v.commit) document.getElementById("ver").textContent = "Unity build of commit " + v.commit + " (" + v.date + ")";
  }).catch(function () {});

  var canvas = document.getElementById("unity-canvas");
  var config = {
    arguments: [],
    dataUrl: "Build/WebStatic.data.unityweb",
    frameworkUrl: "Build/WebStatic.framework.js.unityweb",
    codeUrl: "Build/WebStatic.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "FINIFUGU",
    productName: "Roll A Planet",
    productVersion: "0.1.0",
    // phones with a very dense screen draw at 2x at most, to keep the frame rate up
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  };
  function fail(message) {
    document.getElementById("boot").style.display = "flex";
    document.getElementById("msg").textContent = "The game could not start: " + message;
  }
  var script = document.createElement("script");
  script.src = "Build/WebStatic.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.getElementById("fill").style.width = (100 * p) + "%";
    }).then(function () {
      document.getElementById("boot").style.display = "none";
      canvas.focus();
    }).catch(fail);
  };
  script.onerror = function () { fail("the game files did not load"); };
  document.body.appendChild(script);
</script>
</body>
</html>
